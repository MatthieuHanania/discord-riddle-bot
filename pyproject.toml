[project]
name = "riddlebot"
version = "0.2.0"
description = "Modern and interactive Discord Riddle & Target Detector Bot"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Matthieu Hanania" }
]
keywords = ["discord", "discord-py", "bot", "riddle", "game", "slash-commands", "uv"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Chat",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "discord.py>=2.3.0",
    "python-dotenv>=1.0.0",
]
